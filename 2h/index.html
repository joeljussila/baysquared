<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bay² · Live the future in Shenzhen</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Big+Shoulders+Display:wght@300;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Michroma&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:rgb(17, 14, 11);-webkit-font-smoothing:antialiased;font-family:'IBM Plex Mono',monospace}a{color:inherit;text-decoration:none}a:hover{opacity:.7}</style></head>
<body><svg width="0" height="0" style="position:absolute"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg><div id="stage" data-screen-label="2h Threshold" style="width:1280px;height:800px;position:absolute;left:50%;top:50%;transform-origin:center;overflow:hidden;background:#110e0b;color:#ede6dc">
        <img data-drift="" src="../images/baysquared_pic6.jpg" style="position:absolute;top:0;right:0;width:900px;height:100%;object-fit:cover;object-position:center 45%;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%);mask-image:linear-gradient(90deg,transparent 0%,#000 30%)">
        <div style="position:absolute;left:64px;right:64px;top:44px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#a89c8f"><span>22.54° N</span><div style="display:flex;gap:36px"><a href="#">The trip</a><a href="#">FAQ</a></div></div>
        <div style="position:absolute;left:64px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center;gap:20px">
          <div data-fade="0" style="font-family:'Instrument Serif',serif;font-size:160px;line-height:.85;letter-spacing:.02em">bay<span style="font-size:.42em;vertical-align:top;position:relative;top:.06em;margin-left:.05em;letter-spacing:0">2</span></div>
          <div data-fade="400" style="font-family:'Instrument Serif',serif;font-size:38px;font-style:italic;line-height:1.1">Live the future in Shenzhen</div><div data-fade="800" style="display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#c9bdb0"><span style="width:6px;height:6px;border-radius:50%;background:#3d6bff"></span>December 2026</div>
        </div>
        <div style="position:absolute;left:64px;bottom:48px;display:flex;align-items:center;gap:28px;font-size:11px;letter-spacing:.22em;text-transform:uppercase"><a href="#" style="background:#ede6dc;color:#110e0b;padding:16px 26px">Apply</a><span style="color:#a89c8f">By application only</span></div>
        <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.16;mix-blend-mode:screen;pointer-events:none"><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
      </div><script>
function fit(){var s=document.getElementById('stage');var k=Math.min(innerWidth/1280,innerHeight/800);s.style.transform='translate(-50%,-50%) scale('+k+')';}
addEventListener('resize',fit);fit();
document.querySelectorAll('[data-drift]').forEach(function(el,i){el.animate([{transform:'scale(1.04) translate(0,0)'},{transform:'scale(1.07) translate('+(i%2?-1.2:1.2)+'%,-0.8%)'}],{duration:22000+i*1500,direction:'alternate',iterations:Infinity,easing:'ease-in-out'});});
document.querySelectorAll('[data-fade]').forEach(function(el){el.animate([{opacity:0,transform:'translateY(8px)',filter:'blur(4px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:1800,delay:+el.dataset.fade||0,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'});});
</script></body></html>

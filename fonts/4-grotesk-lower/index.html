<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121633"><title>Grotesk lowercase · delta and bay · Live the future in Shenzhen</title><meta name="description" content="delta and bay — Live the future in Shenzhen. A robotics trip, December 2026. By application only."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" as="image" href="../../images/deltaandbay_pic3.jpg"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#121633;--text:#eee8dc;--sub:#d6d2e2;--muted:#b9b5c8;--nav:#cfcadb;--accent:#ff8a3d;--pad:clamp(20px,4.4vw,72px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);-webkit-font-smoothing:antialiased;font-family:'IBM Plex Mono',monospace}
a{color:inherit;text-decoration:none}a:hover{opacity:.7}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--text)}
/* Photo: sand mapped to white, inverted to black, hues rotated back, screened onto the navy. */
.hand{position:absolute;right:-2vw;top:-6vh;height:112vh;height:112dvh;width:auto;max-width:none;filter:url(#whiten) invert(1) hue-rotate(180deg);mix-blend-mode:screen;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 18%);mask-image:linear-gradient(90deg,transparent 0%,#000 18%)}
.nav{position:absolute;left:var(--pad);right:var(--pad);top:max(44px,env(safe-area-inset-top));display:flex;justify-content:flex-end;font-size:clamp(10px,.86vw,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--nav);z-index:3}
.nav div{display:flex;gap:clamp(20px,2.8vw,44px)}
.apply-link{border-bottom:1px solid var(--accent);padding-bottom:3px}
.hero{position:absolute;left:var(--pad);right:var(--pad);bottom:max(clamp(28px,7vh,72px),env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:clamp(12px,2.2vh,22px);align-items:flex-start;z-index:3}
.name{font-family:'Archivo',sans-serif;font-size:clamp(52px,min(9.7vw,15.5vh),210px);line-height:.86;letter-spacing:-.02em;font-stretch:125%;font-weight:800}
.tag{font-size:clamp(13px,min(1.48vw,2.4vh),26px);letter-spacing:.3em;text-transform:uppercase;color:var(--sub)}
.date{display:flex;align-items:center;gap:12px;font-size:clamp(11px,.94vw,15px);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.date i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cta{margin-top:10px;border:1px solid var(--text);padding:15px 26px;font-size:clamp(11px,.86vw,13px);letter-spacing:.24em;text-transform:uppercase}
.grain{position:absolute;inset:0;width:100%;height:100%;opacity:.14;mix-blend-mode:screen;pointer-events:none;z-index:4}
/* Portrait / phones: hand on top, text stacked below. */
@media (max-aspect-ratio:1/1){
  .hand{right:-4vw;top:calc(4vh - 38px);width:100vw;height:auto;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 14%);mask-image:linear-gradient(180deg,transparent 0%,#000 14%)}
  #stage::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(18,22,51,.85) 30%,rgba(18,22,51,0) 55%);z-index:2;pointer-events:none}
  .nav{top:max(24px,env(safe-area-inset-top))}
  .nav .opt{display:none}
  .name{font-size:min(14.8vw,11vh)}
  .tag{font-size:clamp(12px,3.6vw,18px);letter-spacing:.22em;line-height:1.6}
  .date{font-size:11px}
  .cta{align-self:stretch;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* Font option: Grotesk lowercase */
.name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-stretch:normal;letter-spacing:-.045em;line-height:.9;font-size:calc(1.2 * clamp(52px,min(9.7vw,15.5vh),210px))}
.tag{font-family:'Space Grotesk',sans-serif;font-weight:500;text-transform:lowercase;letter-spacing:-.005em;font-size:calc(1.45 * clamp(13px,min(1.48vw,2.4vh),26px))}
.date,.cta,.nav{text-transform:lowercase;letter-spacing:.12em}
@media (max-aspect-ratio:1/1){.name{font-size:calc(1.2 * min(14.8vw,11vh))}.tag{font-size:clamp(18px,5vw,24px);letter-spacing:0}}
</style></head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><filter id="whiten" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="1.028 0 0 0 0 0 1.164 0 0 0 0 0 1.545 0 0 0 0 0 1 0"></feColorMatrix></filter></svg>
<div id="stage" data-screen-label="3d Glass hand · Night">
<img class="hand" data-drift="" src="../../images/deltaandbay_pic3.jpg" alt="Iridescent glass hand" width="828" height="1019" fetchpriority="high">
<div class="nav"><div><a class="opt" href="#">The trip</a><a class="opt" href="#">FAQ</a><a class="apply-link" href="../../apply/">Apply</a></div></div>
<div class="hero">
<h1 class="name" data-fade="0" style="margin:0">delta and bay</h1>
<div class="tag" data-fade="400">live the future in shenzhen</div>
<div class="date" data-fade="800">December 2026</div>
<a class="cta" href="../../apply/" data-fade="1100">Apply for a place</a>
</div>
<svg class="grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
</div><script>
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
document.querySelectorAll('[data-drift]').forEach(function(el,i){el.animate([{transform:'scale(1.04) translate(0,0)'},{transform:'scale(1.07) translate('+(i%2?-1.2:1.2)+'%,-0.8%)'}],{duration:22000+i*1500,direction:'alternate',iterations:Infinity,easing:'ease-in-out'});});
document.querySelectorAll('[data-fade]').forEach(function(el){el.animate([{opacity:0,transform:'translateY(8px)',filter:'blur(4px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:1800,delay:+el.dataset.fade||0,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'});});
}
</script></body></html>
